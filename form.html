<!-- form.html -->
<button class="form-toggle-btn">Feedback</button>

<div class="umsi-feedback-form">
<form action="https://formspree.io/f/mrbparep" method="POST">
    <h4 class="form-title">UMSI Resource Portal Feedback</h4>

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="First and Last" required />

    <label for="umid">UMID:</label>
    <input type="text" id="umid" name="umid" pattern="\d{8}" maxlength="8" placeholder="8-digit ID" required />

    <label for="year">Year:</label>
    <select id="year" name="year" required>
        <option value="">Select Year</option>
        <option value="Freshman">Freshman</option>
        <option value="Sophomore">Sophomore</option>
        <option value="Junior">Junior</option>
        <option value="Senior">Senior</option>
        <option value="Graduate">Graduate</option>
    </select>

    <label for="suggestions">Suggestions:</label>
    <textarea id="suggestions" name="suggestions" rows="4" placeholder="What would improve your experience?"></textarea>

    <button type="submit" class="form-submit-btn">Submit</button>
</form>
</div>
